<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good HTML5 Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Student Page</h1>
    <p>A simple example of well-structured HTML5</p>
  </header>
  <nav aria-label="Main navigation">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
  </nav>
  <main>
    <article id="about">
      <h2>About Me</h2>
      <p>Hello! I am learning how to build web pages using HTML and CSS.</p>
    </article>
    <section id="skills">
      <h2>My Skills</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Basic JavaScript</li>
      </ul>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Email: student@example.com</p>
    </section>
  </main>
  <footer><p>&copy; 2026 My Student Page</p></footer>
</body>
</html>
